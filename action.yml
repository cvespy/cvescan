name: 'CVESpy'
description: 'Block malicious packages and catch CVEs on every push. Keeps a live package inventory across repos for "are we affected?" search.'
author: 'CVESpy'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'CVESpy API key (from cvespy.com/dashboard)'
    required: true
  api-url:
    description: 'CVESpy API URL (default: https://api.cvespy.com)'
    required: false
    default: 'https://api.cvespy.com'
  github-token:
    description: 'GitHub token for PR comments (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  min-severity:
    description: 'Minimum severity to report (critical, high, medium, low)'
    required: false
    default: 'high'
  fail-on-critical:
    description: 'Fail the workflow if critical CVEs are found'
    required: false
    default: 'true'
  fail-on-malware:
    description: 'Fail the workflow when a known-malicious package (OSV MAL- advisory) is found, regardless of min-severity or fail-on-critical'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'Comment vulnerability summary on PRs'
    required: false
    default: 'true'
  include-dev-deps:
    description: 'Include dev dependencies in scan'
    required: false
    default: 'false'

outputs:
  cve-count:
    description: 'Total number of CVEs found'
  critical-count:
    description: 'Number of critical CVEs'
  high-count:
    description: 'Number of high CVEs'
  malware-count:
    description: 'Number of known-malicious packages found'
  report:
    description: 'Full vulnerability report (JSON)'

runs:
  using: 'node20'
  main: 'dist/index.js'
